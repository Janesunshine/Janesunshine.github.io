{% include base_path %}

<!-- start custom head snippets -->

<!-- favicon: "JS" monogram, ink + parchment, matching the site's serif identity -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#f7f5ee"/>
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- Typefaces: Bricolage Grotesque (bold display — swaps out the literary
     serif for a blocky, contemporary product face), Inter (body sans),
     IBM Plex Mono (data/terminal accents) -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"/>

<!-- Cool minimalist theme (light); keep a single fixed theme -->
<script>
  try { localStorage.setItem("theme", "light"); } catch (e) {}
  document.documentElement.removeAttribute("data-theme");
</script>

<!-- Cool-minimalist editorial redesign (loads after main.css so it wins the cascade) -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/claude.css"/>
<script defer src="{{ base_path }}/assets/js/glow-scroll.js"></script>


<!-- Support for MatJax -->
<script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<!-- end custom head snippets -->
